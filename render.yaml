services:
  - type: web
    name: VayuSangam-api
    runtime: python
    region: oregon
    plan: free

    # Run from repository root so `backend` is treated as a Python package.
    rootDir: .

    # Install backend dependencies.
    buildCommand: pip install -r backend/requirements.txt

    # Start FastAPI through the backend package.
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT

    # Render uses this endpoint to verify the service is healthy.
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      # Set this manually in the Render dashboard.
      # Example:
      # https://ai-nwp.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false